apiVersion: apps/v1
kind: Deployment
metadata:
  name: seeding-bot
  labels:
    app: seeding-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seeding-bot
  template:
    metadata:
      labels:
        app: seeding-bot
    spec:
      containers:
        - name: seeding-bot
          image: seeding-bot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: HTTP_PORT
              value: "8081"
            - name: CONFIG_PATH
              value: "/app/config.yaml"
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
